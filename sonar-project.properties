sonar.projectKey=ordina
sonar.projectName=Ordina
sonar.sourceEncoding=UTF-8

sonar.sources=app,scripts,views,public
sonar.tests=tests
sonar.exclusions=vendor/**,public/uploads/**

# Reports produced by scripts/sonar-scan.ps1 inside the web container
sonar.php.coverage.reportPaths=coverage/clover.xml
sonar.php.tests.reportPath=coverage/junit.xml
sonar.php.phpstan.reportPaths=coverage/phpstan.json

# Same coverage scope as phpunit.xml <source><exclude>: these layers are
# verified by integration tests / the HTTP smoke test, not unit tests
sonar.coverage.exclusions=app/Controller/**,app/Repository/Mysql/**,app/Repository/InMemory/**,app/routes.php,app/Core/Controller.php,app/Core/Session.php,app/Core/RedisSessionHandler.php,app/Core/Database.php,views/**,public/**,scripts/**

# Wait for the Quality Gate result so the scan reports pass/fail
sonar.qualitygate.wait=true
